<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cardápio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f0f2f5;
font-family:Arial;
}

.container{
width:100%;
max-width:900px;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

ul{
list-style:none;
}

li{
padding:10px;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
}

</style>
</head>

<body>

<div class="container">

<h1>Cardápio de Esfihas</h1>

<div class="grid">

<div>
<h2>Salgadas</h2>
<ul>
<li>Carne <span>R$5</span></li>
<li>Frango <span>R$5</span></li>
<li>Calabresa <span>R$6</span></li>
<li>Queijo <span>R$5</span></li>
</ul>
</div>

<div>
<h2>Doces</h2>
<ul>
<li>Chocolate <span>R$6</span></li>
<li>Doce de leite <span>R$6</span></li>
<li>Banana com canela <span>R$6</span></li>
</ul>
</div>

</div>

</div>

</body>
</html>
