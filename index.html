<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cardápio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f0f2f5;
font-family:arial;
height:100vh;
}

.card{
width:100%;
min-height:100vh;
background:white;
padding:40px;
}

img{
border-radius:50%;
width:120px;
display:block;
margin:auto;
}

h1,h2{
text-align:center;
margin-top:20px;
}

ul{
max-width:400px;
margin:20px auto;
}

li{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<div class="card">

<img src="esfiha.jpg" alt="foto cardápio">

<h1>Cardápio de Esfihas</h1>

<h2>Salgadas</h2>
<ul>
<li>Carne <span>R$5,00</span></li>
<li>Frango <span>R$5,00</span></li>
<li>Calabresa <span>R$6,00</span></li>
<li>Queijo <span>R$5,00</span></li>
<li>Pizza <span>R$6,00</span></li>
</ul>

<h2>Doces</h2>
<ul>
<li>Chocolate <span>R$6,00</span></li>
<li>Doce de leite <span>R$6,00</span></li>
<li>Banana com canela <span>R$6,00</span></li>
</ul>

</div>

</body>
</html>
