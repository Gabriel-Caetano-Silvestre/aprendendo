<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cardápio Digital</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f3e1c8;
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .cardapio {
    background-color: #fff0d9;
    padding: 30px 40px;
    border-radius: 10px;
    width: 800px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  h1 {
    text-align: center;
    color: #b05c3b;
    margin-bottom: 30px;
  }

  .secoes {
    display: flex;
    justify-content: space-between;
  }

  .secao {
    width: 45%;
  }

  h2 {
    border-bottom: 2px solid #b05c3b;
    padding-bottom: 5px;
    margin-bottom: 15px;
    color: #4b2e2e;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px dotted #b05c3b;
  }

  .footer {
    text-align: center;
    margin-top: 30px;
    color: #b05c3b;
    font-weight: bold;
  }

  .footer p {
    margin: 5px 0;
    font-weight: normal;
  }
</style>
</head>
<body>

<div class="cardapio">
  <h1>CARDÁPIO DIGITAL</h1>

  <div class="secoes">
    <div class="secao">
      <h2>Esfiha Salgada</h2>
      <ul>
        <li>Carne <span>R$5</span></li>
        <li>Frango <span>R$5</span></li>
        <li>Calabresa <span>R$6</span></li>
        <li>Queijo <span>R$5</span></li>
        <li>Pizza <span>R$6</span></li>
      </ul>
    </div>

    <div class="secao">
      <h2>Esfiha Doce</h2>
      <ul>
        <li>Chocolate <span>R$6</span></li>
        <li>Doce de leite <span>R$6</span></li>
        <li>Banana c/ canela <span>R$6</span></li>
      </ul>
    </div>
  </div>

  <div class="footer">
    <p>RECEBA EM CASA: (12) 3456-7890</p>
    <p>Rua Alegre, 123 - Cidade Brasileira</p>
  </div>
</div>

</body>
</html>
